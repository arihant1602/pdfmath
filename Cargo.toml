[package]
name = "pdfmath"
version = "0.1.0"
edition = "2024"
description = "PDF arithmetic from the command line: merge, cut, slice and compress PDFs with a Python-like scripting language"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/arihant1602/pdfmath"
homepage = "https://github.com/arihant1602/pdfmath"
readme = "README.md"
keywords = ["pdf", "merge", "split", "compress", "cli"]
categories = ["command-line-utilities"]
exclude = ["/npm", "/.github"]

[dependencies]
jpeg-decoder = { version = "0.3.2", default-features = false }
jpeg-encoder = "0.7.1"
lopdf = { version = "0.46.0", default-features = false }
rustyline = { version = "19.0.0", default-features = false, features = ["with-file-history"] }

[[bin]]
name = "pdfm"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
