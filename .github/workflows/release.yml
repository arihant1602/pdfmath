# Build pdfm for every platform and publish to npm when a tag like v0.1.0 is pushed.
# Requires the repository secret NPM_TOKEN (an npm automation token).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test --release

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, platform: linux, arch: x64, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, platform: linux, arch: arm64, musl: true }
          - { os: macos-latest, target: x86_64-apple-darwin, platform: darwin, arch: x64 }
          - { os: macos-latest, target: aarch64-apple-darwin, platform: darwin, arch: arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: win32, arch: x64 }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, platform: win32, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - shell: bash
        run: |
          exe=pdfm; [ "${{ matrix.platform }}" = win32 ] && exe=pdfm.exe
          node scripts/npm-platform-package.mjs ${{ matrix.platform }} ${{ matrix.arch }} target/${{ matrix.target }}/release/$exe
      - uses: actions/upload-artifact@v4
        with:
          name: pdfmath-${{ matrix.platform }}-${{ matrix.arch }}
          path: npm/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: npm/dist
          merge-multiple: true
      - name: Publish platform packages, then the launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          ./scripts/sync-version.sh
          cp README.md npm/pdfmath/README.md
          # Idempotent: skip versions already on npm, retry with backoff (npm rate-limits new packages).
          publish() {
            dir=$1
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published"
              return 0
            fi
            for attempt in 1 2 3 4; do
              if npm publish "$dir" --access public; then
                return 0
              fi
              echo "publish of $name failed (attempt $attempt), waiting before retry"
              sleep $((attempt * 60))
            done
            return 1
          }
          failed=0
          for d in npm/dist/pdfmath-*; do
            chmod +x "$d"/bin/* || true
            publish "$d" || failed=1
            sleep 20
          done
          if [ "$failed" = 1 ]; then
            echo "::error::some platform packages failed to publish; not publishing the launcher"
            exit 1
          fi
          publish npm/pdfmath
